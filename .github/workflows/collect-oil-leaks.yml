name: Collect reviewed oil-leak photographs

on:
  push:
    branches: [ML-tests]
    paths:
      - .github/workflows/collect-oil-leaks.yml
      - tools/collect_oil_leaks.py
      - tools/test_collect_oil_leaks.py
      - tools/dataset-requirements.txt
      - yollo-ML/sources/approved.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oil-leak-collection-ML-tests
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/ML-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ML-tests
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verification dependencies
        run: python -m pip install -r tools/dataset-requirements.txt
      - name: Test filters without network downloads
        run: python -m unittest discover -s tools -p 'test_collect_oil_leaks.py' -v
      - name: Download approved originals on GitHub only
        run: python tools/collect_oil_leaks.py --target 70
      - name: Commit only dataset results to ML-tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- yollo-ML
          if git diff --cached --quiet; then
            echo 'No dataset changes.'
          else
            git commit -m 'Добавить проверенные фотографии течей масла и атрибуцию'
            git push origin HEAD:ML-tests
          fi
